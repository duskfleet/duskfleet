# Duskfleet global configuration.
# Relative paths are resolved from the directory containing this file.

# Where runtime data lives (SQLite database and per-run logs). Git-ignored.
data_dir: ../data

# Where agents created at runtime (`agents create` on the CLI, create_agent over MCP,
# or by hand) are stored. Agent files a checkout commits go in config/agents (builtins);
# a user agent with the same id overrides the builtin. Default: <data_dir>/agents (git-ignored).
user_agents_dir: null

# Private project registry, merged over config/projects.yaml (same id = private wins).
# Keep machine-specific absolute paths here, never in the versioned file.
# Default: <data_dir>/projects.yaml (git-ignored).
user_projects_file: null

# Optional safety fence: when non-empty, a project path must be inside one of these
# directories to be executed. Use absolute paths or ~. Leave empty to allow any
# existing directory except / and your home directory itself.
allowed_project_roots: []
#  - ~/Documents/Projects

# Agent used by run_agent (and `run` without --agent) when none is supplied. null makes
# the agent mandatory: Duskfleet ships no starter agent, so there is no sensible default.
# Create your first one with `npm run cli -- agents create <id> --model haiku -- "<prompt>"`.
default_agent: null

# Maximum number of Claude Code processes running at the same time.
max_concurrent_runs: 8
# Two agents in the same working copy would fight over branches and files, and a
# scheduler tick must not start an agent whose previous run is still going. A
# run_agent that would exceed these is refused with a clear error (not queued).
max_concurrent_per_project: 4
max_concurrent_per_agent: 1

# Schedules live in the database (create_schedule over MCP, or the dashboard shows
# them). The scheduler ticks inside whichever Duskfleet process holds the lease:
# the MCP server Claude Desktop keeps alive, or `duskfleet serve` under launchd.
scheduler:
  enabled: true            # kill switch, re-read every tick: false stops all firing
  tick_seconds: 30
  default_time_zone: Europe/London
  # Final message of a scheduled run that found no work; feeds the 7-day idle-cost stats.
  # A regex literal or a plain case-insensitive regex; a schedule can override it.
  # Anchored at the start: a run that did work and mentions "nothing to do" later is not idle.
  # An invalid pattern is ignored with a warning (the default applies).
  noop_pattern: '/^\s*(nothing to do|no .* in ready)/i'
  # Pause a schedule after this many consecutive runs that completed with 0 tool calls or
  # ended needs review; the reason shows on /schedules until it is resumed. 0 = never.
  auto_pause_after: 5
  # Command gates (gate.command on a schedule) run `/bin/sh -c <command>` in the project
  # directory with the full environment of the DuskFleet process, outside every Claude Code
  # allow-list, on every tick. Off by default: create/update refuse them (MCP, CLI, dashboard)
  # and a stored one makes its tick record `error` instead of running. Agent gates are not affected.
  allow_command_gates: false

claude:
  # Path to the Claude Code binary. Resolution order: CLAUDE_BIN env var, this
  # value, `claude` on PATH, ~/.local/bin/claude. GUI-launched MCP servers often
  # have a minimal PATH, so setting this explicitly is the most reliable option.
  binary: null
  # Default for runs: true = --strict-mcp-config, the child session sees no MCP
  # server at all (fast, and it cannot recurse into Duskfleet). An agent or a
  # project with inherit_mcp: true opts out and sees the MCP servers of the user
  # running Duskfleet, including claude.ai connectors (Atlassian, Figma, ...).
  # false = every run inherits everything. Verified 2026-10-08: with strict a run
  # sees 25 tools, without it 168 (140 from connectors).
  strict_mcp_config: true
  # Which Claude Code settings files the child session loads: user, project, local.
  # null = Claude's default (all of them). Unattended runs can hang on user-level
  # hooks that expect a terminal or a desktop session; setting [project, local]
  # keeps the target project's own settings while skipping ~/.claude/settings.json.
  # Note: this also skips user-level permission allow-lists.
  setting_sources: [project, local]
  # bypassPermissions is refused by Claude Code in unattended runs
  # (--permission-prompts none), so this gate only changes the error message.
  # Use dontAsk with an explicit allowed_tools list instead.
  allow_bypass_permissions: false
  # Default per-run limits, overridable per agent.
  default_timeout_minutes: 30
  default_max_budget_usd: 5
