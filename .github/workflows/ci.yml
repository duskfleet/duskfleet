# Quality gates for every pull request (docs/development.md "Quality gates"). Everything here runs without a Claude
# login and without network beyond npm: the tests replay recorded stream-json through
# packages/mcp/test/fake-claude.js, so a CI run never spawns Claude and never costs money.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Public repo hygiene (no home paths, usernames or machine-specific values)
        run: npm run check:public

      - name: Lint and format (Biome)
        run: npm run lint

      - name: Build core + mcp
        run: npm run build

      # After the build: the tool names come from packages/mcp/dist/tools.json, which the build writes.
      - name: Docs sync (every MCP tool in docs/mcp-server.md, every docs page linked from README.md)
        run: npm run check:docs

      - name: Typecheck (core, mcp, web)
        run: |
          npm run typecheck
          npm run typecheck -w @duskfleet/web

      - name: Tests with coverage floor
        run: npm run test:coverage

      - name: Build dashboard
        run: npm run build:web

      - name: Pack check (duskfleet + @duskfleet/web tarballs, allow-lists, same version)
        run: npm run check:pack -- --require-web-build

      - name: Packed CLI smoke (npx on the duskfleet tarball, outside the repository)
        run: |
          npm pack -w duskfleet --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npx --yes ./duskfleet-*.tgz --help

      # Report-only until the Next 16 upgrade: Next 15 pins postcss 8.4.31, which carries a high
      # advisory, and an npm override does not take (npm drops the package instead). The step
      # stays visible in the run summary; make it blocking again once `npm audit` is clean.
      - name: Dependency audit (high and critical; report-only, see docs/development.md "Quality gates")
        run: npm audit --audit-level=high
        continue-on-error: true
