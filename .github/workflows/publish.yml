# Stages the two npm packages, `duskfleet` and `@duskfleet/web`, at the same version with npm
# provenance (docs/development.md "Publishing"). The `publish` job runs for a tag `v<version>`:
# called by release.yml right after it creates the tag (the usual path), or on a tag pushed by
# hand. Every pull request runs the `dry-run` job, the same steps ending in
# `npm publish --dry-run`, so a broken pack is caught before the tag.
#
# The `publish` job STAGES both packages (`npm stage publish`): the versions reach the registry
# but stay private until the maintainer approves them with 2FA from a laptop (`npm stage list`,
# `npm stage approve <stage-id>`, docs/development.md "Releasing"). Staging needs no 2FA, so it
# works with the NPM_TOKEN repository secret: a granular access token WITHOUT 2FA bypass that can
# read and write `duskfleet` and `@duskfleet/web` only (npm expires those after 90 days at most:
# recreate it when a release fails with E401/E403). It is also where npm is heading: bypass
# tokens lose direct publishing in January 2027.
#
# npm trusted publishing (OIDC) stays configured on both packages (`release.yml`, the workflow
# that starts the run, since this file runs as a reusable workflow it calls): npm tries the OIDC
# exchange first and falls back to the token. Today the registry refuses this repository's OIDC
# token with "package not found" (npm/cli#9969: GitHub's immutable `sub` claim, forced on
# repositories created after 2026-07-15, is not understood by the registry). Once that is fixed
# the token can be deleted. `id-token: write` is what lets npm sign the provenance statement in
# either case; each package.json `repository` must name this repository or the registry refuses
# the provenance.
name: Publish to npm
run-name: "${{ github.event_name == 'pull_request' && format('npm publish dry-run for PR #{0}', github.event.pull_request.number) || format('npm publish {0}', inputs.tag || github.ref_name) }}"

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_call:
    inputs:
      tag:
        description: "The tag to publish (v<version>), already pushed"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    name: npm publish dry-run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-dry-run-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Both packages carry the same version
        run: |
          core=$(node -p "require('./packages/duskfleet/package.json').version")
          web=$(node -p "require('./apps/web/package.json').version")
          if [ "$core" != "$web" ]; then
            echo "::error::duskfleet is $core but @duskfleet/web is $web (bump both together)"
            exit 1
          fi
          echo "version $core"

      - name: Install
        run: npm ci

      - name: Checks (what CI runs)
        run: npm run check

      - name: Build dashboard
        run: npm run build:web

      - name: Pack check with the dashboard build
        run: npm run check:pack -- --require-web-build

      # npm "auto-corrects" a manifest it dislikes (it dropped the `bin` entries on 2026-10-28)
      # and only warns; here that warning is a failure, so the tag is never cut on such a pack.
      - name: npm publish --dry-run (duskfleet)
        working-directory: packages/duskfleet
        run: |
          set -o pipefail
          npm publish --dry-run --access public 2>&1 | tee "$RUNNER_TEMP/dry-run-duskfleet.log"
          ! grep -q "auto-corrected" "$RUNNER_TEMP/dry-run-duskfleet.log"

      - name: npm publish --dry-run (@duskfleet/web)
        working-directory: apps/web
        run: |
          set -o pipefail
          npm publish --dry-run --access public 2>&1 | tee "$RUNNER_TEMP/dry-run-web.log"
          ! grep -q "auto-corrected" "$RUNNER_TEMP/dry-run-web.log"

  publish:
    name: npm publish (duskfleet, @duskfleet/web)
    if: inputs.tag != '' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      # The tag being published: the caller's input, or the pushed tag.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # No dependency cache on the publishing job: what ships is built from a clean install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches the version of both packages
        run: |
          tag="${TAG#v}"
          core=$(node -p "require('./packages/duskfleet/package.json').version")
          web=$(node -p "require('./apps/web/package.json').version")
          if [ "$tag" != "$core" ] || [ "$tag" != "$web" ]; then
            echo "::error::tag $TAG does not match duskfleet $core and @duskfleet/web $web"
            exit 1
          fi
          echo "publishing version $tag"

      - name: Install
        run: npm ci

      - name: Checks (what CI runs)
        run: npm run check

      - name: Build dashboard
        run: npm run build:web

      - name: Pack check with the dashboard build
        run: npm run check:pack -- --require-web-build

      # `npm stage` is recent: the runner's npm may predate it, so npm is updated here, after
      # the install and the checks ran with the npm the lockfile was made with.
      - name: npm with `npm stage`
        run: |
          npm install -g npm@^11.21
          npm --version
          npm stage --help > /dev/null

      # A version already on the registry is skipped, and so is one already staged (the
      # registry answers E409 "previously staged version"), so a re-run after a failed second
      # package finishes the release instead of failing on the first. npm "auto-corrects" a
      # manifest it dislikes and only warns (it dropped the `bin` entries of the first v0.1.0
      # tag on 2026-10-31, and the dry-run guard of the other job only covers pull requests):
      # a `--dry-run` goes first and the step fails on that warning, so a broken pack never
      # reaches the registry. `--loglevel verbose` shows why the registry refused the OIDC
      # exchange before npm fell back to the token.
      - name: npm stage publish (duskfleet)
        working-directory: packages/duskfleet
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          if npm view "duskfleet@${TAG#v}" version > /dev/null 2>&1; then
            echo "duskfleet@${TAG#v} is already published, skipping"
            exit 0
          fi
          npm publish --dry-run --access public 2>&1 | tee "$RUNNER_TEMP/dry-run-duskfleet.log"
          if grep -q "auto-corrected" "$RUNNER_TEMP/dry-run-duskfleet.log"; then
            echo "::error::npm auto-corrected the manifest, see the warnings above"
            exit 1
          fi
          if npm stage publish --provenance --access public --loglevel verbose 2>&1 | tee "$RUNNER_TEMP/stage-duskfleet.log"; then
            echo "duskfleet@${TAG#v} is staged, waiting for the maintainer's approval"
          elif grep -q "previously staged version" "$RUNNER_TEMP/stage-duskfleet.log"; then
            echo "duskfleet@${TAG#v} was already staged, waiting for the maintainer's approval"
          else
            exit 1
          fi

      - name: npm stage publish (@duskfleet/web)
        working-directory: apps/web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          if npm view "@duskfleet/web@${TAG#v}" version > /dev/null 2>&1; then
            echo "@duskfleet/web@${TAG#v} is already published, skipping"
            exit 0
          fi
          npm publish --dry-run --access public 2>&1 | tee "$RUNNER_TEMP/dry-run-web.log"
          if grep -q "auto-corrected" "$RUNNER_TEMP/dry-run-web.log"; then
            echo "::error::npm auto-corrected the manifest, see the warnings above"
            exit 1
          fi
          if npm stage publish --provenance --access public --loglevel verbose 2>&1 | tee "$RUNNER_TEMP/stage-web.log"; then
            echo "@duskfleet/web@${TAG#v} is staged, waiting for the maintainer's approval"
          elif grep -q "previously staged version" "$RUNNER_TEMP/stage-web.log"; then
            echo "@duskfleet/web@${TAG#v} was already staged, waiting for the maintainer's approval"
          else
            exit 1
          fi

      - name: What to do next
        run: |
          {
            echo "## Staged, not public yet"
            echo
            echo "Both packages are staged at \`${TAG#v}\`. Approve them with 2FA from a laptop:"
            echo
            echo '```bash'
            echo "npm stage list duskfleet          # the stage-id of ${TAG#v}"
            echo "npm stage approve <stage-id>"
            echo "npm stage list @duskfleet/web"
            echo "npm stage approve <stage-id>"
            echo "npm view duskfleet version && npm view @duskfleet/web version"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
