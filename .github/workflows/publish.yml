# Publishes the two npm packages, `duskfleet` and `@duskfleet/web`, at the same version with npm
# provenance (docs/development.md "Publishing"). The `publish` job runs for a tag `v<version>`:
# called by release.yml right after it creates the tag (the usual path), or on a tag pushed by
# hand. Every pull request runs the `dry-run` job, the same steps ending in
# `npm publish --dry-run`, so a broken pack is caught before the tag.
#
# The `publish` job authenticates with npm trusted publishing (OIDC), no npm token: each package
# on npmjs.com names this repository and the workflow file that STARTS the run as its trusted
# publisher, with "Allow npm publish" on. That file is `release.yml`: this one runs as a reusable
# workflow it calls, and npm matches the top-level `workflow_ref` claim (with `publish.yml` the
# registry answered 404 on 2026-10-31). A tag pushed by hand runs this file directly, so it does
# not match and fails to authenticate: cut releases from release.yml. `id-token: write` lets the
# job mint the OIDC token, which npm also uses to sign the provenance statement. Each package.json
# `repository` must name this repository or the registry refuses the provenance.
name: Publish to npm
run-name: "${{ github.event_name == 'pull_request' && format('npm publish dry-run for PR #{0}', github.event.pull_request.number) || format('npm publish {0}', inputs.tag || github.ref_name) }}"

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_call:
    inputs:
      tag:
        description: "The tag to publish (v<version>), already pushed"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    name: npm publish dry-run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-dry-run-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Both packages carry the same version
        run: |
          core=$(node -p "require('./packages/duskfleet/package.json').version")
          web=$(node -p "require('./apps/web/package.json').version")
          if [ "$core" != "$web" ]; then
            echo "::error::duskfleet is $core but @duskfleet/web is $web (bump both together)"
            exit 1
          fi
          echo "version $core"

      - name: Install
        run: npm ci

      - name: Checks (what CI runs)
        run: npm run check

      - name: Build dashboard
        run: npm run build:web

      - name: Pack check with the dashboard build
        run: npm run check:pack -- --require-web-build

      # npm "auto-corrects" a manifest it dislikes (it dropped the `bin` entries on 2026-10-28)
      # and only warns; here that warning is a failure, so the tag is never cut on such a pack.
      - name: npm publish --dry-run (duskfleet)
        working-directory: packages/duskfleet
        run: |
          set -o pipefail
          npm publish --dry-run --access public 2>&1 | tee "$RUNNER_TEMP/dry-run-duskfleet.log"
          ! grep -q "auto-corrected" "$RUNNER_TEMP/dry-run-duskfleet.log"

      - name: npm publish --dry-run (@duskfleet/web)
        working-directory: apps/web
        run: |
          set -o pipefail
          npm publish --dry-run --access public 2>&1 | tee "$RUNNER_TEMP/dry-run-web.log"
          ! grep -q "auto-corrected" "$RUNNER_TEMP/dry-run-web.log"

  publish:
    name: npm publish (duskfleet, @duskfleet/web)
    if: inputs.tag != '' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      # The tag being published: the caller's input, or the pushed tag.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # No dependency cache on the publishing job: what ships is built from a clean install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches the version of both packages
        run: |
          tag="${TAG#v}"
          core=$(node -p "require('./packages/duskfleet/package.json').version")
          web=$(node -p "require('./apps/web/package.json').version")
          if [ "$tag" != "$core" ] || [ "$tag" != "$web" ]; then
            echo "::error::tag $TAG does not match duskfleet $core and @duskfleet/web $web"
            exit 1
          fi
          echo "publishing version $tag"

      - name: Install
        run: npm ci

      - name: Checks (what CI runs)
        run: npm run check

      - name: Build dashboard
        run: npm run build:web

      - name: Pack check with the dashboard build
        run: npm run check:pack -- --require-web-build

      # A version already on the registry is skipped, so a re-run after a failed second publish
      # finishes the release instead of failing on the first package. npm "auto-corrects" a
      # manifest it dislikes and only warns (it dropped the `bin` entries of the v0.1.0 tag on
      # 2026-10-31, the dry-run guard below only covers pull requests): the publish is aborted
      # on that warning with `--dry-run` first, so a broken pack never reaches the registry.
      # `--loglevel verbose`: npm logs the registry's reason for refusing the OIDC token exchange
      # only at that level, then falls back to no credential and the PUT ends in a bare 404.
      - name: npm publish --provenance (duskfleet)
        working-directory: packages/duskfleet
        run: |
          set -o pipefail
          if npm view "duskfleet@${TAG#v}" version > /dev/null 2>&1; then
            echo "duskfleet@${TAG#v} is already published, skipping"
          else
            npm publish --dry-run --access public 2>&1 | tee "$RUNNER_TEMP/publish-duskfleet.log"
            if grep -q "auto-corrected" "$RUNNER_TEMP/publish-duskfleet.log"; then
              echo "::error::npm auto-corrected the manifest, see the warnings above"
              exit 1
            fi
            npm publish --provenance --access public --loglevel verbose
          fi

      - name: npm publish --provenance (@duskfleet/web)
        working-directory: apps/web
        run: |
          set -o pipefail
          if npm view "@duskfleet/web@${TAG#v}" version > /dev/null 2>&1; then
            echo "@duskfleet/web@${TAG#v} is already published, skipping"
          else
            npm publish --dry-run --access public 2>&1 | tee "$RUNNER_TEMP/publish-web.log"
            if grep -q "auto-corrected" "$RUNNER_TEMP/publish-web.log"; then
              echo "::error::npm auto-corrected the manifest, see the warnings above"
              exit 1
            fi
            npm publish --provenance --access public --loglevel verbose
          fi
